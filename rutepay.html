                  <div key={emp.id} className="bg-white rounded-2xl shadow-sm border p-6">
                    <div className="flex justify-between items-center mb-4 border-b pb-3">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center"><UserCircle size={24}/></div>
                        <div>
                          <h3 className="font-bold text-gray-800 text-lg">{emp.name}</h3>
                          <p className="text-xs text-gray-500">{emp.team}</p>
                        </div>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="text-sm font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-lg">{empQueue.length} รายการ</span>
                        <button 
                          onClick={() => { setAddingForEmp(emp); setSelectedCustIds([]); setSearchQuery(''); }}
                          className="bg-green-100 hover:bg-green-200 text-green-700 px-3 py-1.5 rounded-lg flex items-center gap-1.5 text-xs font-bold transition-colors"
                        >
                          <Plus size={14}/> เพิ่มคิว
                        </button>
                      </div>
                    </div>

                    {empQueue.length > 0 ? (
                      <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse text-sm">
                          <thead><tr className="bg-gray-50 text-gray-600 border-b">
                            <th className="p-3">รหัส/ชื่อ</th>
                            <th className="p-3">สินค้า/โซน</th>
                            <th className="p-3">ยอดชำระงวดนี้</th>
                            <th className="p-3 text-center">นำออกจากคิว</th>
                          </tr></thead>
                          <tbody>
                            {empQueue.map(c => (
                              <tr key={c.id} className="border-b hover:bg-gray-50">
                                <td className="p-3"><div className="font-bold text-gray-800">{c.name}</div><div className="text-xs text-gray-500">{c.id}</div></td>
                                <td className="p-3"><div className="font-medium text-gray-700">{c.product||'-'}</div><div className="text-xs text-gray-500">{c.zone}</div></td>
                                <td className="p-3 font-medium text-blue-600">฿{Number(c.amount).toLocaleString()}</td>
                                <td className="p-3 text-center">
                                  <button onClick={()=>toggleRoute(c)} className="text-red-500 hover:text-red-700 text-xs bg-red-50 hover:bg-red-100 transition-colors px-3 py-1.5 rounded-lg font-medium">นำออก</button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    ) : (
                      <div className="text-center py-6 text-gray-400 text-sm bg-gray-50 rounded-xl">ไม่มีลูกค้าในคิวของพนักงานนี้</div>
                    )}
                  </div>
                );
              })}

              {unassignedQueue.length > 0 && (
                <div className="bg-white rounded-2xl shadow-sm border border-red-200 p-6">
                  <div className="flex justify-between items-center mb-4 border-b pb-3">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 bg-red-50 text-red-600 rounded-full flex items-center justify-center"><AlertCircle size={24}/></div>
                      <div>
                        <h3 className="font-bold text-red-600 text-lg">ลูกค้าในคิวที่ยังไม่ระบุพนักงาน</h3>
                        <p className="text-xs text-red-400">กรุณากลับไปที่หน้า 'จัดการลูกค้า' เพื่อมอบหมายพนักงาน</p>
                      </div>
                    </div>
                    <div className="text-right">
                      <span className="text-sm font-bold text-red-600">{unassignedQueue.length} รายการ</span>
                    </div>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse text-sm">
                      <thead><tr className="bg-gray-50 text-gray-600 border-b">
                        <th className="p-3">รหัส/ชื่อ</th>
                        <th className="p-3">สินค้า/โซน</th>
                        <th className="p-3">ยอด</th>
                        <th className="p-3 text-center">นำออกจากคิว</th>
                      </tr></thead>
                      <tbody>
                        {unassignedQueue.map(c => (
                          <tr key={c.id} className="border-b hover:bg-gray-50">
                            <td className="p-3"><div className="font-bold text-gray-800">{c.name}</div><div className="text-xs text-gray-500">{c.id}</div></td>
                            <td className="p-3"><div className="font-medium text-gray-700">{c.product||'-'}</div><div className="text-xs text-gray-500">{c.zone}</div></td>
                            <td className="p-3 font-medium text-blue-600">฿{Number(c.amount).toLocaleString()}</td>
                            <td className="p-3 text-center">
                              <button onClick={()=>toggleRoute(c)} className="text-red-500 hover:text-red-700 text-xs bg-red-50 hover:bg-red-100 transition-colors px-3 py-1.5 rounded-lg font-medium">นำออก</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* Modal ดึงลูกค้าเข้าคิวรายบุคคล */}
              {addingForEmp && (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                  <div className="bg-white rounded-2xl w-full max-w-2xl shadow-2xl flex flex-col max-h-[85vh]">
                    <div className="p-5 border-b flex justify-between items-center">
                      <div>
                        <h3 className="text-xl font-bold text-gray-800">เพิ่มคิวให้: <span className="text-blue-600">{addingForEmp.name}</span></h3>
                        <p className="text-xs text-gray-500 mt-1">เลือกลูกค้าจากฐานข้อมูลเพื่อดึงเข้าคิววันนี้</p>
                      </div>
                      <button onClick={() => setAddingForEmp(null)} className="text-gray-400 hover:text-gray-600 bg-gray-100 p-2 rounded-xl"><X size={20}/></button>
                    </div>
                    
                    <div className="p-4 border-b bg-gray-50">
                      <div className="flex gap-2">
                        <div className="relative flex-1">
                          <Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" size={18}/>
                          <input 
                            type="text" 
                            placeholder="ค้นหาชื่อ, รหัส, โซน..." 
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                          />
                        </div>
                        <button onClick={() => setShowQrScanner(true)} className="bg-indigo-600 text-white p-2.5 rounded-xl hover:bg-indigo-700 flex items-center justify-center transition-colors shadow-sm" title="สแกน QR Code เพื่อเลือก">
                          <QrCode size={20}/>
                        </button>
                      </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4">
                      {filteredAvailable.length > 0 ? (
                        <div className="space-y-2">
                          {filteredAvailable.map(c => (
                            <label key={c.id} className={`flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-colors ${selectedCustIds.includes(c.id) ? 'bg-blue-50 border-blue-200' : 'bg-white border-gray-100 hover:bg-gray-50'}`}>
                              <input 
                                type="checkbox" 
                                className="w-5 h-5 text-blue-600 rounded focus:ring-blue-500 cursor-pointer"
                                checked={selectedCustIds.includes(c.id)}
                                onChange={(e) => {
                                  if (e.target.checked) setSelectedCustIds(prev => [...prev, c.id]);
                                  else setSelectedCustIds(prev => prev.filter(id => id !== c.id));
                                }}
                              />
                              <div className="flex-1 min-w-0">
                                <div className="font-bold text-gray-800 text-sm">{c.name} <span className="text-xs text-gray-400 font-normal">({c.id})</span></div>
                                <div className="text-xs text-gray-500 flex items-center gap-2 mt-0.5">
                                  <span>📍 {c.zone || 'ไม่ระบุโซน'}</span>
                                  <span className="text-amber-600">ยอดคงเหลือ: ฿{(c.remainingBalance || 0).toLocaleString()}</span>
                                </div>
                              </div>
                              <div className="text-sm font-bold text-blue-600">฿{Number(c.amount).toLocaleString()}</div>
                            </label>
                          ))}
                        </div>
                      ) : (
                        <div className="text-center py-10 text-gray-400">
                          {availableCustomers.length === 0 ? 'ลูกค้าทุกคนอยู่ในคิววันนี้แล้ว' : 'ไม่พบลูกค้าที่ค้นหา'}
                        </div>
                      )}
                    </div>

                    <div className="p-4 border-t bg-white rounded-b-2xl flex justify-between items-center">
                      <span className="text-sm font-medium text-gray-600">เลือกแล้ว <span className="font-bold text-blue-600 text-lg">{selectedCustIds.length}</span> รายการ</span>
                      <div className="flex gap-2">
                        <button onClick={() => setAddingForEmp(null)} className="px-5 py-2.5 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200">ยกเลิก</button>
                        <button 
                          onClick={handleConfirmAddQueue} 
                          disabled={selectedCustIds.length === 0}
                          className="px-5 py-2.5 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
                        >
                          <Plus size={18}/> ยืนยันเพิ่มเข้าคิว
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {showQrScanner && (
                <QRScannerModal onClose={() => setShowQrScanner(false)} onScan={handleQrScanInQueue} onError={setAlertMsg} />
              )}

              {alertMsg && <AlertModal msg={alertMsg} onClose={()=>setAlertMsg('')}/>}
            </div>
          );
        }

        // ─── CUSTOMER MANAGER ─────────────────────────────────────────────────────────
        function CustomerManager({ customers, employees }) {
          const fileInputRef = useRef(null);
          const [isModalOpen, setIsModalOpen] = useState(false);
          const [editingCust, setEditingCust] = useState(null);
          const [viewingCust, setViewingCust] = useState(null);
          const [alertMsg, setAlertMsg] = useState('');
          const [confirmDeleteId, setConfirmDeleteId] = useState(null);
          
          const initialFormState = {
            id:'', name:'', phone:'', product:'', amount:0, zone:'', team:'', 
            lat:'', lng:'', status:'pending', inRouteToday:false, assignedWorkerId:'', 
            purchaseDate:'', dueDate:'', branch:'', salesPerson:'', mapUrl:'',
            totalTerms: 0, remainingBalance: 0, dueDayOfMonth: ''
          };
          const [formData, setFormData] = useState(initialFormState);

          const handleWorkerChange = async (custId, workerId) => {
            await updateDoc(doc(db,'artifacts',appId,'public','data','customers_v8',custId), {assignedWorkerId:workerId});
          };

          const handleSave = async () => {
            const newId = formData.id || `C${Date.now().toString().slice(-4)}`;
            if (editingCust && editingCust.id !== newId) await deleteDoc(doc(db,'artifacts',appId,'public','data','customers_v8',editingCust.id));
            await setDoc(doc(db,'artifacts',appId,'public','data','customers_v8',newId), {
              ...formData,
              id: newId,
              amount: Number(formData.amount),
              totalTerms: Number(formData.totalTerms),
              remainingBalance: Number(formData.remainingBalance),
              dueDayOfMonth: Number(formData.dueDayOfMonth),
              lat: formData.lat ? Number(formData.lat) : '',
              lng: formData.lng ? Number(formData.lng) : ''
            });
            setIsModalOpen(false);
          };

          const handleExport = () => exportToExcel(customers.map(c=>({...c})), `Customers_${new Date().toISOString().split('T')[0]}.xlsx`, setAlertMsg);

          return (
            <div className="bg-white rounded-2xl shadow-sm border p-6">
              <div className="flex justify-between items-center mb-6">
                <h2 className="text-2xl font-bold text-gray-800">จัดการลูกค้า</h2>
                <div className="flex gap-2">
                  <input type="file" accept=".xlsx,.xls,.csv" ref={fileInputRef} className="hidden"/>
                  <button onClick={handleExport} className="bg-green-600 text-white px-4 py-2 rounded-xl flex items-center gap-2 text-sm"><Download size={18}/> ส่งออก</button>
                  <button onClick={() => { setEditingCust(null); setFormData(initialFormState); setIsModalOpen(true); }}
                    className="bg-blue-600 text-white px-4 py-2 rounded-xl flex items-center gap-2 text-sm"><Plus size={18}/> เพิ่มลูกค้า</button>
                </div>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse text-sm">
                  <thead><tr className="bg-gray-50 text-gray-600 border-b">
                    {['รหัส/ชื่อ','ยอดต่องวด','ยอดคงเหลือ','พนักงาน','สถานะ','จัดการ'].map(h=><th key={h} className="p-3">{h}</th>)}
                  </tr></thead>
                  <tbody>
                    {customers.map(c=>{
                      const worker = employees.find(e=>e.id===c.assignedWorkerId);
                      return (
                        <tr key={c.id} className="border-b hover:bg-gray-50">
                          <td className="p-3"><div className="font-bold text-gray-800">{c.name} <span className="text-xs text-gray-400">({c.id})</span></div><div className="text-xs text-blue-500"><a href={`tel:${c.phone}`}>{c.phone}</a></div></td>
                          <td className="p-3 font-medium text-blue-600">฿{Number(c.amount).toLocaleString()}</td>
                          <td className="p-3 font-medium text-amber-600">฿{Number(c.remainingBalance || 0).toLocaleString()}</td>
                          <td className="p-3">
                            <select value={c.assignedWorkerId||''} onChange={e=>handleWorkerChange(c.id,e.target.value)}
                              className={`border rounded-lg p-1.5 text-xs w-full ${!c.assignedWorkerId?'bg-red-50 text-red-600':'bg-gray-50'}`}>
                              <option value="">-- ไม่ระบุ --</option>
                              {employees.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
                            </select>
                          </td>
                          <td className="p-3">
                            {c.status==='completed'?<span className="bg-green-100 text-green-700 px-2 py-1 rounded-full text-xs">สำเร็จ</span>:
                             c.status==='skipped'?<span className="bg-orange-100 text-orange-700 px-2 py-1 rounded-full text-xs">ข้าม</span>:
                             c.status==='returned'?<span className="bg-red-100 text-red-700 px-2 py-1 rounded-full text-xs">คืน</span>:
                             <span className="bg-yellow-100 text-yellow-700 px-2 py-1 rounded-full text-xs">รอ</span>}
                          </td>
                          <td className="p-3">
                            <div className="flex gap-1">
                              <button onClick={()=>setViewingCust(c)} className="p-1.5 text-gray-500 hover:bg-gray-100 rounded-lg"><Eye size={15}/></button>
                              <button onClick={()=>{setEditingCust(c);setFormData({...initialFormState, ...c});setIsModalOpen(true);}} className="p-1.5 text-blue-600 hover:bg-blue-100 rounded-lg"><Edit size={15}/></button>
                              <button onClick={()=>setConfirmDeleteId(c.id)} className="p-1.5 text-red-600 hover:bg-red-100 rounded-lg"><Trash2 size={15}/></button>
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>

              {viewingCust && <CustomerDetailModal cust={viewingCust} employees={employees} onClose={()=>setViewingCust(null)}/>}

              {isModalOpen && (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                  <div className="bg-white rounded-2xl w-full max-w-2xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
                    <div className="flex justify-between items-center mb-4">
                      <h3 className="text-xl font-bold">{editingCust?'แก้ไขลูกค้า':'เพิ่มลูกค้าใหม่'}</h3>
                      <button onClick={()=>setIsModalOpen(false)} className="text-gray-400 hover:text-gray-600"><X size={24}/></button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 border-b pb-4 mb-4">
                      <div>
                        <label className="text-sm font-bold text-gray-700 block mb-1">ยอดต้องเก็บต่องวด (฿)</label>
                        <input value={formData.amount} onChange={e=>setFormData(p=>({...p,amount:e.target.value}))} type="number" className="w-full border-2 border-blue-100 bg-blue-50 text-blue-700 font-bold rounded-xl p-2.5 outline-none focus:border-blue-500"/>
                      </div>
                      <div>
                        <label className="text-sm font-bold text-gray-700 block mb-1">ยอดคงเหลือทั้งหมด (฿)</label>
                        <input value={formData.remainingBalance} onChange={e=>setFormData(p=>({...p,remainingBalance:e.target.value}))} type="number" className="w-full border-2 border-amber-100 bg-amber-50 text-amber-700 font-bold rounded-xl p-2.5 outline-none focus:border-amber-500"/>
                      </div>
                      <div>
                        <label className="text-sm font-bold text-gray-700 block mb-1">จำนวนงวดทั้งหมด</label>
                        <input value={formData.totalTerms} onChange={e=>setFormData(p=>({...p,totalTerms:e.target.value}))} type="number" className="w-full border rounded-xl p-2.5 outline-none"/>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {[
                        {label:'รหัสลูกค้า',key:'id',type:'text',placeholder:'ปล่อยว่างสร้างอัตโนมัติ'},
                        {label:'ชื่อลูกค้า',key:'name',type:'text'},
                        {label:'เบอร์โทร',key:'phone',type:'text'},
                        {label:'สินค้า/บริการ',key:'product',type:'text'},
                        {label:'ครบกำหนดทุกวันที่',key:'dueDayOfMonth',type:'number',placeholder:'1-31'},
                        {label:'โซน',key:'zone',type:'text'},
                        {label:'พนักงานขาย',key:'salesPerson',type:'text'},
                        {label:'สาขา',key:'branch',type:'text'},
                        {label:'วันที่ซื้อ',key:'purchaseDate',type:'date'},
                        {label:'วันครบกำหนด',key:'dueDate',type:'date'},
                        {label:'ละติจูด',key:'lat',type:'text'},
                        {label:'ลองจิจูด',key:'lng',type:'text'},
                      ].map(f=>(
                        <div key={f.key}>
                          <label className="text-sm text-gray-600 block mb-1">{f.label}</label>
                          <input value={formData[f.key]||''} onChange={e=>setFormData(p=>({...p,[f.key]:e.target.value}))} type={f.type} placeholder={f.placeholder||''} className="w-full border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none"/>
                        </div>
                      ))}
                      <div className="md:col-span-2">
                        <label className="text-sm text-gray-600 block mb-1">URL Google Map</label>
                        <input value={formData.mapUrl||''} onChange={e=>setFormData(p=>({...p,mapUrl:e.target.value}))} type="url" className="w-full border rounded-xl p-2.5 text-sm"/>
                      </div>
                      <div className="md:col-span-2">
                        <label className="text-sm text-gray-600 block mb-1">พนักงานที่เก็บเงิน</label>
                        <select value={formData.assignedWorkerId||''} onChange={e=>setFormData(p=>({...p,assignedWorkerId:e.target.value}))} className="w-full border rounded-xl p-2.5 text-sm">
                          <option value="">-- ไม่ระบุ --</option>
                          {employees.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
                        </select>
                      </div>
                    </div>
                    <div className="mt-6 flex justify-end gap-3">
                      <button onClick={()=>setIsModalOpen(false)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-xl font-bold">ยกเลิก</button>
                      <button onClick={handleSave} className="px-4 py-2 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700">บันทึก</button>
                    </div>
                  </div>
                </div>
              )}

              {confirmDeleteId && (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[100] p-4">
                  <div className="bg-white rounded-2xl w-full max-w-sm p-6 text-center shadow-xl">
                    <h3 className="text-xl font-bold text-red-600 mb-2">ยืนยันการลบ</h3>
                    <p className="text-gray-600 mb-6">ต้องการลบลูกค้ารายนี้ใช่หรือไม่?</p>
                    <div className="flex gap-3">
                      <button onClick={()=>setConfirmDeleteId(null)} className="flex-1 py-2 bg-gray-100 rounded-xl font-bold">ยกเลิก</button>
                      <button onClick={async()=>{await deleteDoc(doc(db,'artifacts',appId,'public','data','customers_v8',confirmDeleteId));setConfirmDeleteId(null);}} className="flex-1 py-2 bg-red-600 text-white rounded-xl font-bold">ลบ</button>
                    </div>
                  </div>
                </div>
              )}
              {alertMsg&&<AlertModal msg={alertMsg} onClose={()=>setAlertMsg('')}/>}
            </div>
          );
        }

        // ─── CUSTOMER DETAIL WITH PAYMENT HISTORY ─────────────────────────────────────
        function CustomerDetailModal({ cust, employees, onClose }) {
          const history = cust.paymentHistory || [];
          
          return (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
              <div className="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl max-h-[90vh] flex flex-col">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-xl font-bold flex items-center gap-2"><Info className="text-blue-500"/> ข้อมูลลูกค้า</h3>
                  <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><X size={24}/></button>
                </div>
                
                <div className="overflow-y-auto flex-1 pr-1">
                  <div className="space-y-2.5 text-sm">
                    {[
                      {label:'รหัสลูกค้า',val:cust.id},
                      {label:'ชื่อ',val:cust.name},
                      {label:'เบอร์โทร',val:<a href={`tel:${cust.phone}`} className="text-blue-600">{cust.phone}</a>},
                      {label:'สินค้า',val:cust.product||'-'},
                      {label:'ยอดเก็บต่องวด',val:<span className="font-bold text-green-600">฿{(cust.amount||0).toLocaleString()}</span>},
                      {label:'จำนวนงวด',val:`${cust.totalTerms||0} งวด`},
                      {label:'ยอดคงเหลือ',val:<span className="font-bold text-amber-600">฿{(cust.remainingBalance||0).toLocaleString()}</span>},
                      {label:'ครบกำหนดทุกวันที่',val:cust.dueDayOfMonth ? `วันที่ ${cust.dueDayOfMonth}` : '-'},
                      {label:'สาขา/โซน',val:`${cust.branch||'-'} (${cust.zone})`},
                      {label:'พนักงานเก็บเงิน',val:employees.find(e=>e.id===cust.assignedWorkerId)?.name||'ยังไม่ระบุ'},
                    ].map((r,i)=>(
                      <div key={i} className="flex justify-between py-2 border-b border-gray-50">
                        <span className="text-gray-500">{r.label}:</span>
                        <strong className="text-gray-900 text-right">{r.val}</strong>
                      </div>
                    ))}
                  </div>

                  {/* Payment History Table */}
                  <div className="mt-6 border-t pt-4">
                    <h4 className="font-bold text-gray-800 mb-3 flex items-center gap-2"><Wallet size={16}/> บันทึกการจ่ายเงิน</h4>
                    <div className="max-h-40 overflow-y-auto rounded-xl border border-gray-200">
                      <table className="w-full text-xs text-left border-collapse">
                        <thead className="bg-gray-100 sticky top-0 shadow-sm z-10">
                          <tr>
                            <th className="p-2.5 font-semibold text-gray-700">วันที่</th>
                            <th className="p-2.5 font-semibold text-gray-700 text-right">ยอด (฿)</th>
                            <th className="p-2.5 font-semibold text-gray-700">พนักงาน</th>
                            <th className="p-2.5 font-semibold text-gray-700">หมายเหตุ</th>

                const canvas = document.createElement('canvas');
                let width = img.width, height = img.height;
                const maxSize = 400;
                if (width > height) {
                  if (width > maxSize) { height *= maxSize / width; width = maxSize; }
                } else {
                  if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = "#ffffff"; // กันพื้นหลังโปร่งใสกลายเป็นสีดำตอนแปลงเป็น JPEG
                ctx.fillRect(0, 0, width, height);
                ctx.drawImage(img, 0, 0, width, height);
                setFormData(p => ({ ...p, [field]: canvas.toDataURL('image/jpeg', 0.8) }));
              };
