        // ─── WORKER APP ───────────────────────────────────────────────────────────
        function WorkerApp({ workerData, onLogout, customers, employees, receiptSettings }) {
          const [routeStarted, setRouteStarted] = useState(false);
          const [routeData, setRouteData] = useState(null);
          const [powModalTask, setPowModalTask] = useState(null);
          const [viewingCust, setViewingCust] = useState(null);
          const [confirmDialog, setConfirmDialog] = useState(null);
          const [alertMsg, setAlertMsg] = useState('');
          const [gpsStatus, setGpsStatus] = useState('pending');
          const [notifications, setNotifications] = useState([]); 
          const [notifPermission, setNotifPermission] = useState(false);
          const [showNotifBell, setShowNotifBell] = useState(false);
          
          const [manualOrder, setManualOrder] = useState(null);
          const [draggingTask, setDraggingTask] = useState(null);
          const [showQrScanner, setShowQrScanner] = useState(false);
          
          // States for Receipt and Printer
          const [printerDevice, setPrinterDevice] = useState(null);
          const [printReceiptData, setPrintReceiptData] = useState(null);

          // Gimmick States
          const [floatingTexts, setFloatingTexts] = useState([]);
          const [showConfetti, setShowConfetti] = useState(false);
          
          // Summary State
          const [showSummary, setShowSummary] = useState(false);

          const notifiedTasksRef = useRef(new Set());
          const watchIdRef = useRef(null);
          const longPressTimer = useRef(null);

          const activeRouteCustomers = customers.filter(c => c.inRouteToday && c.assignedWorkerId === workerData.id);
          const totalCustomers = activeRouteCustomers.length;
          const collectedCustomers = activeRouteCustomers.filter(c=>c.status==='completed').length;
          const failedCustomers = activeRouteCustomers.filter(c=>c.status==='skipped'||c.status==='returned').length;
          const targetAmount = activeRouteCustomers.reduce((s,c)=>s+Number(c.amount||0),0);
          const collectedAmount = activeRouteCustomers.reduce((s,c)=>s+Number(c.collectedAmount||0),0);
          const progressCount = activeRouteCustomers.filter(c=>c.status!=='pending').length;
          const progressPct = totalCustomers > 0 ? Math.round((progressCount/totalCustomers)*100) : 0;

          const prevCountRef = useRef(progressCount);

          const getGreeting = () => {
            const hour = new Date().getHours();
            if (hour < 12) return 'สวัสดีตอนเช้า ☀️';
            if (hour < 17) return 'สวัสดีตอนบ่าย 🌤️';
            if (hour < 20) return 'สวัสดีตอนเย็น 🌅';
            return 'สวัสดีตอนค่ำ 🌙';
          };

          const checkGeofence = useCallback((lat, lng) => {
            if (!routeData) return;
            const pending = routeData.optimizedList.filter(t => t.status === 'pending');
            if (!pending.length) return;
            const nextTask = pending[0];
            if (!nextTask.lat || !nextTask.lng) return;
            const dist = calculateDistanceMeters(lat, lng, nextTask.lat, nextTask.lng);
            if (dist <= GEOFENCE_RADIUS_METERS && !notifiedTasksRef.current.has(nextTask.id)) {
              notifiedTasksRef.current.add(nextTask.id);
              const notif = { id: Date.now(), task: nextTask, distanceM: Math.round(dist) };
              setNotifications(prev => [notif, ...prev.slice(0, 4)]);
              setShowNotifBell(true);
              sendNativeNotification(`📍 ใกล้ถึง ${nextTask.name} แล้ว!`, `ระยะทาง ${Math.round(dist)} เมตร — กรุณาเตรียมตัว`);
            }
          }, [routeData]);

          useEffect(() => {
            if (progressCount > prevCountRef.current) {
              const audio = new Audio('https://actions.google.com/sounds/v1/cartoon/pop.ogg');
              audio.play().catch(e => console.log('Audio error:', e));
            }
            if (totalCustomers > 0 && progressCount === totalCustomers && prevCountRef.current < totalCustomers) {
              setShowConfetti(true);
              setTimeout(() => setShowConfetti(false), 4000);
            }
            prevCountRef.current = progressCount;
          }, [progressCount, totalCustomers]);

          useEffect(() => {
            if (routeStarted) {
              setRouteData(optimizeRoute(workerData.currentLocation, activeRouteCustomers, manualOrder));
            }
          }, [customers, routeStarted, manualOrder, workerData.currentLocation]);

          const handleStartRoute = async () => {
            const granted = await requestNotificationPermission();
            setNotifPermission(granted);
            setRouteData(optimizeRoute(workerData.currentLocation, activeRouteCustomers));
            setRouteStarted(true);
            if (navigator.geolocation) {
              navigator.geolocation.getCurrentPosition(
                pos => {
                  setGpsStatus('active');
                  updateDoc(doc(db,'artifacts',appId,'public','data','employees_v8',workerData.id), {'currentLocation.lat':pos.coords.latitude,'currentLocation.lng':pos.coords.longitude}).catch(()=>{});
                },
                () => setGpsStatus('error')
              );
            }
          };

          const handleNavigate = (task) => {
            if (task.mapUrl?.trim()) { window.open(task.mapUrl,'_blank'); return; }
            if (task.lat && task.lng) {
              window.open(`https://www.google.com/maps/dir/?api=1&origin=${workerData.currentLocation.lat},${workerData.currentLocation.lng}&destination=${task.lat},${task.lng}&travelmode=driving`,'_blank');
            } else {
              setAlertMsg('ไม่พบพิกัดสำหรับลูกค้ารายนี้');
            }
          };

          const handleSkipOrReturn = (task, status, reason) => setConfirmDialog({task,status,reason});

          const confirmUpdateStatus = async () => {
            if (!confirmDialog) return;
            await updateDoc(doc(db,'artifacts',appId,'public','data','customers_v8',confirmDialog.task.id), {
              status: confirmDialog.status, note: confirmDialog.reason, collectedAmount: 0, collectionDate: new Date().toISOString()
            });
            setConfirmDialog(null);
          };

          const connectBluetoothPrinter = async () => {
            try {
              if (!navigator.bluetooth) throw new Error('อุปกรณ์ของคุณไม่รองรับ Web Bluetooth');
              const device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb'] // common generic BLE printer service
              });
              setPrinterDevice(device);
              setAlertMsg(`เชื่อมต่อเครื่องพิมพ์บลูทูธสำเร็จ: ${device.name || 'Unknown Device'}`);
            } catch (err) {
              console.warn(err);
              if (err.name !== 'NotFoundError') { 
                setAlertMsg('อุปกรณ์นี้ไม่รองรับการต่อบลูทูธบนเว็บโดยตรง (เช่น iPhone/iPad)\n\nไม่ต้องกังวลครับ คุณสามารถข้ามขั้นตอนนี้ และกดปุ่ม "พิมพ์ใบเสร็จ" (สีเขียว) ในหน้าบิลเพื่อสั่งพิมพ์ผ่านระบบของมือถือได้เลยครับ');
              }
            }
          };

          const handleQrScan = async (text) => {
            setShowQrScanner(false);
            
            // 1. ตรวจสอบว่าเป็น URL หรือลิงก์ Google Maps หรือไม่
            if (text.startsWith('http://') || text.startsWith('https://')) {
              // ถ้าเป็นลิงก์ ให้เปิดหน้าเว็บหรือแผนที่นำทางใหม่ทันที
              window.open(text, '_blank');
              return;
            }

            // 2. ตรวจสอบว่าใน QR Code มีรหัสลูกค้าซ่อนอยู่หรือไม่ (เพิ่มเข้าคิว)
            const cust = customers.find(c => text.includes(c.id));
            if (cust) {
              if (cust.inRouteToday && cust.assignedWorkerId === workerData.id) {
                setAlertMsg('ลูกค้ารายนี้อยู่ในคิวของคุณอยู่แล้ว');
                return;
              }
              await updateDoc(doc(db,'artifacts',appId,'public','data','customers_v8',cust.id), {
                inRouteToday: true,
                assignedWorkerId: workerData.id,
                status: 'pending',
                collectedAmount: 0,
                note: '',
                photoData: null
              });
              setAlertMsg(`✅ เพิ่ม "${cust.name}" เข้าคิวของคุณเรียบร้อยแล้ว`);
            } else {
              setAlertMsg(`❌ ไม่พบข้อมูลลูกค้าจาก QR Code นี้\n(ข้อมูลที่แสกนได้: ${text})`);
            }
          };

          return (
            <>
              <GlobalStyles/>
              <div className="worker-shell">
                {/* Floating Money Effect */}
                {floatingTexts.map(f => (
                  <div key={f.id} className="floating-money" style={{ left: '50%', top: '50%' }}>
                    +฿{Number(f.amount).toLocaleString()}
                  </div>
                ))}
                
                {/* Confetti Effect */}
                {showConfetti && (
                  <div className="fixed inset-0 pointer-events-none z-[9999] overflow-hidden">
                    {[...Array(30)].map((_, i) => (
                      <div key={i} className="confetti" style={{
                        left: `${10 + Math.random() * 80}%`, top: `${40 + Math.random() * 40}%`,
                        animationDelay: `${Math.random() * 0.5}s`,
                        transform: `translate(-50%, 0) rotate(${Math.random() * 360}deg)`
                      }}>
                        {['🎉','💰','✨','💸'][Math.floor(Math.random()*4)]}
                      </div>
                    ))}
                  </div>
                )}

                {notifications.map((n, i) => i === 0 && (
                  <div key={n.id} className={`notif-toast ${showNotifBell ? 'show' : ''}`}>
                    <div className="flex items-start gap-3">
                      <div className="w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center flex-shrink-0"><BellRing size={20} className="text-amber-600"/></div>
                      <div className="flex-1 min-w-0">
                        <div className="font-bold text-gray-900 text-sm">ใกล้ถึงจุดหมายแล้ว!</div>
                        <div className="text-gray-600 text-sm truncate">{n.task.name}</div>
                        <div className="text-amber-600 text-xs font-medium mt-0.5">ระยะทาง {n.distanceM} เมตร</div>
                      </div>
                      <button onClick={() => setShowNotifBell(false)} className="text-gray-400"><X size={18}/></button>
                    </div>
                  </div>
                ))}

                <div className="worker-header">
                  <div className="flex justify-between items-center mb-4">
                    <div className="flex items-center gap-3">
                      <div className="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center backdrop-blur-sm border border-white/20 shadow-inner"><Car size={24} className="text-white"/></div>
                      <div>
                        <div className="text-blue-200 text-[11px] mb-0.5">{getGreeting()}</div>
                        <div className="font-bold text-white text-lg leading-tight">{workerData.name}</div>
                        <div className="flex items-center gap-1.5 mt-1">
                          <div className={`w-2 h-2 rounded-full gps-dot ${gpsStatus==='active'?'bg-green-400':gpsStatus==='error'?'bg-yellow-400':'bg-gray-400'}`}/>
                          <span className="text-white/80 text-[10px] font-medium">{gpsStatus==='active'?'GPS กำลังทำงาน':gpsStatus==='error'?'GPS มีปัญหา':'รอสัญญาณ GPS'}</span>
                        </div>
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      <button onClick={connectBluetoothPrinter} className={`relative w-9 h-9 rounded-xl flex items-center justify-center transition-colors ${printerDevice ? 'bg-blue-500 text-white shadow-inner' : 'bg-white/15 text-white'}`} title="เชื่อมต่อเครื่องพิมพ์บลูทูธ">
                        <Bluetooth size={18}/>
                        {printerDevice && <div className="absolute top-1 right-1 w-2 h-2 bg-green-400 rounded-full border border-blue-600"></div>}
                      </button>
                      {notifications.length > 0 && (
                        <button onClick={()=>setShowNotifBell(true)} className="relative w-9 h-9 bg-white/15 rounded-xl flex items-center justify-center">
                          <Bell size={18} className="text-white"/>
                          <span className="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-white text-[10px] font-bold flex items-center justify-center">{notifications.length}</span>
                        </button>
                      )}
                      <button onClick={() => setShowSummary(true)} className="w-9 h-9 bg-white/15 rounded-xl flex items-center justify-center"><LogOut size={18} className="text-white"/></button>
                    </div>
                  </div>

                  {routeStarted && totalCustomers > 0 && (
                    <div className="pb-5">
                      <div className="flex justify-between text-blue-100 text-xs mb-2">
                        <span>{progressCount}/{totalCustomers} จุด</span>
                        <span>{progressPct}%</span>
                      </div>
                      <div className="w-full bg-white/20 rounded-full h-1.5">
                        <div className="bg-white h-1.5 rounded-full transition-all duration-700" style={{width:`${progressPct}%`}}/>
                      </div>
                    </div>
                  )}
                </div>

                <div className="p-4 pb-32 space-y-4">
                  {activeRouteCustomers.length === 0 && (
                    <div className="text-center py-20">
                      <div className="w-20 h-20 bg-amber-50 rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-sm"><Clock size={36} className="text-amber-500"/></div>
                      <h2 className="text-xl font-bold text-gray-800 mb-2">ยังไม่มีคิวงานวันนี้</h2>
                      <p className="text-gray-500 text-sm">กรุณารอรับคิวงานจากผู้ดูแลระบบ</p>
                    </div>
                  )}

                  {activeRouteCustomers.length > 0 && !routeStarted && (
                    <div className="mt-6">
                      <div className="bg-white rounded-3xl p-6 shadow-sm border border-blue-100 text-center mb-4">
                        <div className="w-20 h-20 bg-blue-50 rounded-3xl flex items-center justify-center mx-auto mb-4"><Navigation size={36} className="text-blue-500"/></div>
                        <h2 className="text-xl font-bold text-gray-800 mb-1">งานวันนี้ {activeRouteCustomers.length} จุด</h2>
                        <p className="text-gray-500 text-sm mb-2">เป้าหมาย ฿{targetAmount.toLocaleString()}</p>
                        <p className="text-gray-400 text-xs mb-6">ระบบจะใช้ GPS จริงจัดเรียงเส้นทางอัตโนมัติ<br/>และแจ้งเตือนเมื่อคุณใกล้ถึงจุดหมาย</p>
                        <button onClick={handleStartRoute} className="btn-start-pulse w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white py-4 rounded-2xl font-bold text-base shadow-lg active:scale-98 transition-all flex items-center justify-center gap-2">
                          <Zap size={20}/> เริ่มงานและเปิด GPS
                        </button>
                      </div>
                      <h3 className="font-bold text-gray-700 text-sm mb-3 px-1">รายชื่อลูกค้าวันนี้</h3>
                      {activeRouteCustomers.map((c,i) => (
                        <div key={c.id} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mb-2 flex items-center gap-3">
                          <div className="w-8 h-8 bg-gray-100 rounded-xl flex items-center justify-center text-xs font-bold text-gray-500">{i+1}</div>
                          <div className="flex-1 min-w-0">
                            <div className="font-bold text-gray-800 text-sm truncate">{c.name}</div>
                            <div className="text-xs text-gray-500">{c.zone}</div>
                          </div>
                          <div className="font-bold text-blue-600 text-sm">฿{Number(c.amount).toLocaleString()}</div>
                        </div>
                      ))}
                    </div>
                  )}

                  {routeStarted && (
                    <>
                      <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-4">
                        <div className="flex items-center justify-between mb-4">
                          <h3 className="font-bold text-gray-800 text-sm">สรุปยอดวันนี้</h3>
                          <div className="text-xs text-gray-500">{new Date().toLocaleDateString('th-TH',{day:'numeric',month:'short'})}</div>
                        </div>
                        <div className="grid grid-cols-3 gap-3 mb-4">
                          {[{label:'ทั้งหมด',val:totalCustomers,color:'blue'},{label:'สำเร็จ',val:collectedCustomers,color:'green'},{label:'เก็บไม่ได้',val:failedCustomers,color:'red'}].map(s=>(
                            <div key={s.label} className={`rounded-2xl p-3 text-center ${s.color==='blue'?'bg-blue-50':s.color==='green'?'bg-green-50':'bg-red-50'}`}>
                              <div className={`text-xl font-bold ${s.color==='blue'?'text-blue-700':s.color==='green'?'text-green-700':'text-red-600'}`}>{s.val}</div>
                              <div className={`text-[10px] font-medium ${s.color==='blue'?'text-blue-500':s.color==='green'?'text-green-500':'text-red-400'}`}>{s.label}</div>
                            </div>
                          ))}
                        </div>
                        <div className="border-t pt-3 grid grid-cols-2 gap-2">
                          <div>
                            <div className="text-[10px] text-gray-400 mb-0.5">เป้าหมาย</div>
                            <div className="font-bold text-gray-700 text-sm">฿{targetAmount.toLocaleString()}</div>
                          </div>
                          <div className="text-right">
                            <div className="text-[10px] text-gray-400 mb-0.5">เก็บได้จริง</div>
                            <div className="font-bold text-green-600 text-sm">฿{collectedAmount.toLocaleString()}</div>
                          </div>
                        </div>
                      </div>

                      <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-5 relative min-h-[250px] w-full">
                        <div className="absolute top-3 left-3 bg-white/95 px-3 py-1.5 rounded-xl shadow-sm text-xs font-bold text-gray-800 z-30 border flex items-center gap-1.5">
                          <Map size={14} className="text-blue-500"/> แผนที่เส้นทางของคุณ
                        </div>
                        <LiveMapViewWrapper worker={workerData} routeData={routeData} onMarkerClick={setViewingCust} />
                      </div>

                      <div className="flex items-center justify-between mb-2 px-1">
                        <h3 className="font-bold text-gray-700 text-sm flex items-center gap-2"><Route size={15}/> ลำดับเส้นทาง</h3>
                        <div className="flex gap-2 items-center">
                          {manualOrder && <button onClick={() => setManualOrder(null)} className="text-[10px] bg-blue-50 text-blue-600 px-2.5 py-1 rounded-full font-bold flex items-center gap-1 hover:bg-blue-100"><Zap size={10}/> กลับไปเรียงด้วย GPS</button>}
                          <button onClick={() => setShowQrScanner(true)} className="text-[10px] bg-indigo-600 text-white px-2.5 py-1 rounded-full font-bold flex items-center gap-1 hover:bg-indigo-700 shadow-sm"><QrCode size={10}/> สแกน QR Code</button>
                        </div>
                      </div>
                      <div className="text-[11px] text-gray-400 mb-3 px-1 flex items-center gap-1"><GripVertical size={12}/> กดค้างที่การ์ดเพื่อลากสลับลำดับเส้นทางได้</div>

                      <div className="space-y-3 relative">
                        <div className="absolute left-[30px] top-10 bottom-10 w-0.5 bg-gray-100 z-0"/>
                        {routeData?.optimizedList.map((task, idx) => {
                          const isDone = task.status !== 'pending';
                          const firstPendingIdx = routeData.optimizedList.findIndex(t => t.status === 'pending');
                          const isNext = !isDone && idx === firstPendingIdx;
                          const badgeClass = task.status==='completed'?'success':task.status==='skipped'?'skipped':task.status==='returned'?'returned':isNext?'is-next':'pending';
                          const cardClass = isDone?(task.status==='completed'?'is-done-success':'is-done-fail'):isNext?'is-next':'';

                          return (
                            <div key={task.id} data-id={task.id} className={`route-card-draggable route-card ${cardClass} relative z-10 transition-all duration-200`}
                              style={{
                                 opacity: draggingTask === task.id ? 0.8 : 1, transform: draggingTask === task.id ? 'scale(1.03)' : 'none',
                                 boxShadow: draggingTask === task.id ? '0 15px 30px rgba(37,99,235,0.2)' : '', touchAction: draggingTask ? 'none' : 'auto',
                                 userSelect: 'none', WebkitUserSelect: 'none', zIndex: draggingTask === task.id ? 50 : 10
                              }}
                              draggable={task.status === 'pending'}
                              onDragStart={(e) => {
                                 if (task.status !== 'pending') { e.preventDefault(); return; }
                                 setDraggingTask(task.id);
                                 if (!manualOrder) setManualOrder(routeData.optimizedList.filter(t=>t.status==='pending').map(t=>t.id));
                              }}
                              onDragOver={(e) => {
                                 e.preventDefault();
                                 if (!draggingTask || draggingTask === task.id) return;
                                 setManualOrder(prev => {
                                    if(!prev) return prev;
                                    const newOrder = [...prev]; const fromIdx = newOrder.indexOf(draggingTask); const toIdx = newOrder.indexOf(task.id);
                                    if (fromIdx > -1 && toIdx > -1) { newOrder.splice(fromIdx, 1); newOrder.splice(toIdx, 0, draggingTask); return newOrder; }
                                    return prev;
                                 });
                              }}
                              onDragEnd={() => setDraggingTask(null)}
                              onTouchStart={() => {
                                 if (task.status !== 'pending') return;
                                 longPressTimer.current = setTimeout(() => {
                                    if (navigator.vibrate) navigator.vibrate(50);
                                    setDraggingTask(task.id);
                                    if (!manualOrder) setManualOrder(routeData.optimizedList.filter(t=>t.status==='pending').map(t=>t.id));
                                 }, 350); 
                              }}
                              onTouchMove={(e) => {
                                 if (!draggingTask) { clearTimeout(longPressTimer.current); return; }
                                 const touch = e.touches[0]; const elem = document.elementFromPoint(touch.clientX, touch.clientY);
                                 const targetCard = elem?.closest('.route-card-draggable');
                                 if (targetCard && targetCard.dataset.id !== draggingTask) {
                                    setManualOrder(prev => {
                                       if(!prev) return prev;
                                       const newOrder = [...prev]; const fromIdx = newOrder.indexOf(draggingTask); const toIdx = newOrder.indexOf(targetCard.dataset.id);
                                       if (fromIdx > -1 && toIdx > -1) { newOrder.splice(fromIdx, 1); newOrder.splice(toIdx, 0, draggingTask); return newOrder; }
                                       return prev;
                                    });
                                 }
                              }}
                              onTouchEnd={() => { clearTimeout(longPressTimer.current); setDraggingTask(null); }}
                              onTouchCancel={() => { clearTimeout(longPressTimer.current); setDraggingTask(null); }}
                              onContextMenu={(e) => { if (task.status === 'pending') e.preventDefault(); }}
                            >
                              <div className="flex gap-3">
                                <div className={`seq-badge ${badgeClass}`}>
                                  {task.status==='completed'?<CheckCircle size={20}/>:task.status==='skipped'?<SkipForward size={18}/>:task.status==='returned'?<RefreshCcw size={18}/>:task.sequenceLabel}
                                </div>
                                <div className="flex-1 min-w-0">
                                  <div className="flex items-start justify-between gap-2 mb-1">
                                    <button onClick={()=>setViewingCust(task)} className="text-left min-w-0">
                                      <div className={`font-bold text-base leading-tight ${isDone?'text-gray-500':'text-gray-900'} flex items-center gap-1 flex-wrap`}>
                                        {task.name} <span className="text-xs font-normal text-gray-400">({task.id})</span> <Eye size={12} className="text-gray-300"/>
                                      </div>
                                    </button>
                                    {isNext && <span className="next-banner flex-shrink-0">จุดหมายถัดไป</span>}
                                    {task.status==='completed' && <span className="text-xs text-green-600 font-bold bg-green-50 border border-green-200 px-2 py-0.5 rounded-full flex-shrink-0">เก็บแล้ว</span>}
                                    {task.status==='skipped' && <span className="text-xs text-orange-500 font-bold bg-orange-50 border border-orange-200 px-2 py-0.5 rounded-full flex-shrink-0">ข้าม</span>}
                                    {task.status==='returned' && <span className="text-xs text-red-500 font-bold bg-red-50 border border-red-200 px-2 py-0.5 rounded-full flex-shrink-0">คืนสินค้า</span>}
                                  </div>

                                  <div className="flex items-center gap-3 text-xs text-gray-500 mb-2">
                                    <span className="flex items-center gap-1"><MapPin size={11}/>{task.zone}</span>
                                    <span className="flex items-center gap-1 text-blue-600 font-medium"><Package size={11}/>{task.product||'-'}</span>
                                  </div>

                                  {!isDone && (
                                    <div className={`rounded-xl p-3 ${isNext?'bg-amber-50 border border-amber-100':'bg-gray-50 border border-gray-100'}`}>
                                      <div className="flex justify-between items-center mb-1">
                                        <span className="text-xs text-gray-500">ยอดต่องวด</span>
                                        <span className={`font-bold text-base ${isNext?'text-amber-700':'text-blue-600'}`}>฿{task.amount.toLocaleString()}</span>
                                      </div>
                                      <div className="flex justify-between items-center">
                                        <span className="text-[10px] text-gray-400">คงเหลือทั้งหมด</span>
                                        <span className="text-xs text-amber-600 font-medium">฿{(task.remainingBalance||0).toLocaleString()}</span>
                                      </div>
                                      {task.distanceFromPrev !== '-' && (
                                        <div className="text-[11px] text-gray-400 mt-2 pt-2 border-t flex items-center gap-1">
                                          <Route size={10}/> {task.distanceFromPrev} กม. • ~{task.timeFromPrev} นาที
                                        </div>
                                      )}
                                    </div>
                                  )}

                                  {task.status==='completed' && (
                                    <div className="bg-green-50 rounded-xl p-3 border border-green-100">
                                      <div className="flex justify-between items-center mb-1">
                                        <span className="text-xs text-green-600">เก็บได้</span>
                                        <span className="font-bold text-green-700">฿{Number(task.collectedAmount).toLocaleString()}</span>
                                      </div>
                                      <div className="flex justify-between items-center">
                                        <span className="text-[10px] text-gray-400">คงเหลือทั้งหมด</span>
                                        <span className="text-xs text-amber-600">฿{(task.remainingBalance||0).toLocaleString()}</span>
                                      </div>
                                      {task.collectionDate && <div className="text-[11px] text-green-500 mt-2 pt-1 border-t border-green-200">{new Date(task.collectionDate).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})} น.</div>}
                                    </div>
                                  )}

                                  {isNext && (
                                    <div className="mt-3 space-y-2">
                                      <div className="grid grid-cols-2 gap-2">
                                        <button onClick={()=>handleNavigate(task)} className="btn-navigate"><Map size={16}/> นำทาง</button>
                                        <button onClick={()=>setPowModalTask({...task,inputAmount:task.amount,inputNote:'',inputPhoto:null})} className="btn-collect"><CheckCircle size={16}/> บันทึกเก็บเงิน</button>
                                      </div>
                                      <div className="grid grid-cols-2 gap-2">
                                        <button onClick={()=>handleSkipOrReturn(task,'skipped','ลูกค้าไม่อยู่บ้าน / เลื่อน')} className="btn-skip"><SkipForward size={14}/> ข้าม (ไม่อยู่)</button>
                                        <button onClick={()=>handleSkipOrReturn(task,'returned','ลูกค้าคืนสินค้า / ไม่ผ่อนต่อ')} className="btn-return"><RefreshCcw size={14}/> คืนสินค้า</button>
                                      </div>
                                    </div>
                                  )}
                                </div>
                                {task.status === 'pending' && <div className="absolute right-2 top-2 text-gray-300"><GripVertical size={16}/></div>}
                              </div>
                            </div>
                          );
                        })}
                      </div>

                      {progressCount === totalCustomers && totalCustomers > 0 && (
                        <div className="completion-screen">
                          <div className="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-4"><CheckCircle size={44} className="text-white"/></div>
                          <h2 className="text-2xl font-bold mb-1">เยี่ยมมาก! 🎉</h2>
                          <p className="text-green-100 text-sm mb-2">ตรวจสอบครบทุกจุดแล้ว</p>
                          <div className="bg-white/20 rounded-2xl p-4 mb-6 text-left">
                            <div className="flex justify-between text-sm mb-2"><span className="text-green-100">เก็บสำเร็จ</span><span className="font-bold">{collectedCustomers} ราย</span></div>
                            <div className="flex justify-between text-sm"><span className="text-green-100">ยอดเก็บได้</span><span className="font-bold">฿{collectedAmount.toLocaleString()}</span></div>
                          </div>
                          <button onClick={() => setShowSummary(true)} className="w-full bg-white text-green-700 font-bold py-4 rounded-2xl shadow-lg">สิ้นสุดการทำงาน</button>
                        </div>
                      )}
                    </>
                  )}
                </div>
              </div>

              {/* Summary Screen Overlay */}
              {showSummary && (
                <div className="fixed inset-y-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-gray-50 z-[300] flex flex-col overflow-hidden animate-[slideUp_0.3s_ease-out] shadow-2xl border-x border-gray-200">
                  <div className="bg-gradient-to-br from-blue-600 to-blue-800 p-6 pb-10 text-white rounded-b-[2.5rem] shadow-md shrink-0">
                    <div className="flex items-center gap-3 mb-2">
                      <div className="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm"><FileText size={20}/></div>
                      <h2 className="text-2xl font-bold">สรุปผลการทำงาน</h2>
                    </div>
                    <p className="text-blue-100 text-sm opacity-90">{new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
                  </div>
                  
                  <div className="-mt-6 px-4 grid grid-cols-2 gap-3 mb-4 shrink-0 relative z-10">
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center">
                      <div className="text-xs text-gray-500 mb-1">เก็บเงินสำเร็จ (฿)</div>
                      <div className="text-xl font-black text-green-600">฿{collectedAmount.toLocaleString()}</div>
                      <div className="text-[10px] text-green-500 font-medium mt-1 bg-green-50 px-2 py-0.5 rounded-full inline-block self-start">{collectedCustomers} รายการ</div>
                    </div>
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center">
                      <div className="text-xs text-gray-500 mb-1">พลาดเป้า/ข้าม</div>
                      <div className="text-xl font-black text-red-500">{failedCustomers} <span className="text-sm font-normal text-gray-400">รายการ</span></div>
                      <div className="text-[10px] text-gray-500 mt-1">จากทั้งหมด {totalCustomers} รายการ</div>
                    </div>
                  </div>
                  
                  <div className="flex-1 overflow-y-auto px-4 pb-24">
                    <h3 className="font-bold text-gray-800 text-sm mb-3 flex items-center gap-2">
                      <CheckCircle size={16} className="text-green-500"/> รายการที่เก็บสำเร็จ
                    </h3>
                    {activeRouteCustomers.filter(c => c.status === 'completed').length > 0 ? (
                      activeRouteCustomers.filter(c => c.status === 'completed').map((c, idx) => (
                        <div key={c.id} className="bg-white p-3.5 rounded-2xl mb-2.5 flex justify-between items-center shadow-sm border border-gray-100 transition-all">
                          <div className="flex items-start gap-3">
                            <div className="w-8 h-8 rounded-full bg-green-50 text-green-600 flex items-center justify-center font-bold text-xs shrink-0 mt-0.5">{idx + 1}</div>
                            <div>
                              <div className="font-bold text-gray-800 text-sm leading-tight">{c.name} <span className="text-[11px] font-normal text-gray-500">({c.id})</span></div>
                              <div className="text-[11px] text-blue-600 font-medium mt-1 mb-1">{c.product || '-'}</div>
                              <div className="text-[10px] text-gray-400 flex items-center gap-1"><Clock size={10}/> {new Date(c.collectionDate).toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'})} น.</div>
                            </div>
                          </div>
                          <div className="font-black text-green-600 shrink-0">฿{Number(c.collectedAmount).toLocaleString()}</div>
                        </div>
                      ))
                    ) : (
                      <div className="text-center py-10 text-gray-400 text-sm bg-white rounded-2xl border border-gray-100 border-dashed">
                        <div className="w-12 h-12 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-2"><FileText size={20} className="text-gray-300"/></div>
                        ยังไม่มีรายการที่เก็บสำเร็จ
                      </div>
                    )}
                  </div>
                  
                  <div className="p-4 bg-white border-t flex gap-3 absolute bottom-0 left-0 w-full shadow-[0_-10px_20px_rgba(0,0,0,0.03)] shrink-0 z-20">
                    <button onClick={() => setShowSummary(false)} className="flex-1 py-3.5 bg-gray-100 text-gray-700 font-bold rounded-2xl hover:bg-gray-200 active:scale-95 transition-all">กลับไปทำงาน</button>
                    <button onClick={onLogout} className="flex-1 py-3.5 bg-red-500 text-white font-bold rounded-2xl shadow-md hover:bg-red-600 active:scale-95 transition-all flex items-center justify-center gap-2">
                      <LogOut size={18}/> ยืนยันออกจากระบบ
                    </button>
                  </div>
                </div>
              )}

              {powModalTask && (
                <ProofOfWorkSheet
                  task={powModalTask}
                  workerData={workerData}
                  onClose={()=>setPowModalTask(null)}
                  onSave={async (data)=>{
                    // Gimmick: Show floating text
                    const textId = Date.now();
                    setFloatingTexts(prev => [...prev, { id: textId, amount: data.inputAmount }]);
                    setTimeout(() => setFloatingTexts(prev => prev.filter(t => t.id !== textId)), 1800);
                    
                    const audio = new Audio('https://actions.google.com/sounds/v1/cartoon/pop.ogg');
                    audio.play().catch(()=>{});

                    const receiptNo = `RCP-${Date.now().toString().slice(-8)}`;
                    const currentHistoryLen = powModalTask.paymentHistory ? powModalTask.paymentHistory.length : 0;
                    const newRecord = {
                       receiptNo: receiptNo,
                       date: new Date().toISOString(),
                       amount: Number(data.inputAmount),
                       term: currentHistoryLen + 1,
                       note: data.inputNote,
                       workerId: workerData.id
                    };
                    await updateDoc(doc(db,'artifacts',appId,'public','data','customers_v8',data.id), {
                      status:'completed', 
                      collectedAmount:Number(data.inputAmount),
                      note:data.inputNote, 
                      photoData:data.inputPhoto, 
                      collectionDate:new Date().toISOString(),
                      remainingBalance: increment(-Number(data.inputAmount)),
                      paymentHistory: arrayUnion(newRecord)
                    });
                    setPowModalTask(null);
                    
                    // เปิดหน้าต่างพิมพ์ใบเสร็จอัตโนมัติหลังบันทึกเสร็จ
                    const updatedTask = { ...powModalTask, remainingBalance: (powModalTask.remainingBalance || 0) - Number(data.inputAmount) };
                    setPrintReceiptData({ task: updatedTask, record: newRecord });
                  }}
                />
              )}

              {printReceiptData && (
                <ReceiptPreview 
                  record={printReceiptData.record} 
                  task={printReceiptData.task} 
                  settings={receiptSettings} 
                  onClose={() => setPrintReceiptData(null)}
                  printerDevice={printerDevice}
                  setAlertMsg={setAlertMsg}
                />
              )}

              {viewingCust && <CustomerDetailModal cust={viewingCust} employees={employees} onClose={()=>setViewingCust(null)}/>}

              {confirmDialog && (
                <div className="fixed inset-0 bg-black/60 flex items-end justify-center z-[60] backdrop-blur-sm">
                  <div className="confirm-sheet w-full max-w-[430px]">
                    <div className="flex flex-col items-center text-center">
                      <div className={`w-14 h-14 rounded-2xl flex items-center justify-center mb-4 ${confirmDialog.status==='skipped'?'bg-orange-100 text-orange-600':'bg-red-100 text-red-600'}`}>
                        {confirmDialog.status==='skipped'?<SkipForward size={28}/>:<RefreshCcw size={28}/>}
                      </div>
                      <h3 className="text-lg font-bold text-gray-900 mb-1">ยืนยันการทำรายการ</h3>
                      <p className="text-gray-500 text-sm mb-1">"{confirmDialog.reason}"</p>
                      <p className="text-gray-700 font-medium mb-6">{confirmDialog.task.name}</p>
                      <div className="grid grid-cols-2 gap-3 w-full">
                        <button onClick={()=>setConfirmDialog(null)} className="py-3.5 bg-gray-100 text-gray-700 font-bold rounded-2xl">ยกเลิก</button>
                        <button onClick={confirmUpdateStatus} className={`py-3.5 text-white font-bold rounded-2xl ${confirmDialog.status==='skipped'?'bg-orange-500':'bg-red-500'}`}>ยืนยัน</button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {showQrScanner && (
                <QRScannerModal onClose={() => setShowQrScanner(false)} onScan={handleQrScan} onError={setAlertMsg} />
              )}

              {alertMsg && <AlertModal msg={alertMsg} onClose={()=>setAlertMsg('')}/>}
            </>
          );
        }

        // ─── QR SCANNER MODAL ─────────────────────────────────────────────────────────
        function QRScannerModal({ onClose, onScan, onError }) {
          const [loading, setLoading] = useState(true);

          useEffect(() => {
            let scanner = null;
            let isComponentMounted = true;

            loadQrScanner().then((loaded) => {
              if (!loaded || !isComponentMounted) return;
              setLoading(false);
              setTimeout(() => {
                 if(!isComponentMounted) return;
                 scanner = new window.Html5Qrcode("qr-reader");
                 scanner.start(
                   { facingMode: "environment" },
                   { fps: 10, qrbox: { width: 250, height: 250 } },
                   (decodedText) => {
                     if (scanner && scanner.isScanning) {
                       scanner.stop().then(() => {
                         if(isComponentMounted) onScan(decodedText);
                       }).catch(console.error);
                     }
                   },
                   (errorMessage) => { /* ignore scanning errors (empty frames) */ }
                 ).catch(err => {
                   console.error(err);
                   if(onError) onError("ไม่สามารถเปิดกล้องได้ กรุณาตรวจสอบการอนุญาตสิทธิ์");
                   if(isComponentMounted) onClose();
                 });
              }, 150);
            });

            return () => {
              isComponentMounted = false;
              if (scanner && scanner.isScanning) {
                 scanner.stop().catch(console.error);
              }
            };
          }, [onClose, onScan, onError]);

          return (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[200] p-4 backdrop-blur-sm">
              <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl">
                <div className="p-4 border-b flex justify-between items-center bg-white">
                  <h3 className="font-bold text-gray-800 flex items-center gap-2"><QrCode size={18} className="text-indigo-600"/> สแกน QR Code ลูกค้า</h3>
                  <button onClick={onClose} className="text-gray-400 hover:text-gray-600 bg-gray-100 p-1.5 rounded-lg"><X size={20}/></button>
                </div>
                <div className="p-4 bg-gray-50 flex flex-col items-center">
                  {loading ? (
                    <div className="py-16 text-gray-500 text-sm flex flex-col items-center gap-3">
                      <div className="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                      กำลังเปิดกล้อง...
                    </div>
                  ) : (
                    <div id="qr-reader" className="w-full rounded-xl overflow-hidden border-2 border-dashed border-indigo-300 bg-black min-h-[250px]"></div>
                  )}
                  <p className="text-xs text-gray-500 mt-4 text-center leading-relaxed">หันกล้องมือถือไปที่ QR Code <br/>เพื่อดึงลูกค้าเข้าคิว หรือ เปิดแผนที่นำทาง</p>
                </div>
              </div>
            </div>
          );
        }

        // ─── PROOF OF WORK BOTTOM SHEET ─────────────────────────────────────────────
        function ProofOfWorkSheet({ task, workerData, onClose, onSave }) {
          const [amount, setAmount] = useState(task.inputAmount);
          const [note, setNote] = useState('');
          const [photo, setPhoto] = useState(null);
          const fileRef = useRef(null);

          const handlePhotoUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onloadend = () => setPhoto(reader.result);
              reader.readAsDataURL(file);
            }
          };

          const quickAmounts = [task.amount, Math.floor(task.amount * 0.5), Math.floor(task.amount * 0.25)].filter((v,i,a) => a.indexOf(v)===i && v > 0);

          return (
            <div className="pow-backdrop">
              <div className="pow-sheet">
                <div className="w-10 h-1 bg-gray-200 rounded-full mx-auto mb-6"/>
                <div className="flex items-center justify-between mb-6">
                  <div>
                    <h3 className="text-xl font-bold text-gray-900">บันทึกการเก็บเงิน</h3>
                    <p className="text-gray-500 text-sm">{task.name} • {task.id}</p>
                  </div>
                  <button onClick={onClose} className="w-9 h-9 bg-gray-100 rounded-xl flex items-center justify-center text-gray-500"><X size={18}/></button>
                </div>

                <div className="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-5 flex items-center justify-between">
                  <div>
                    <div className="text-xs text-blue-500 font-medium">ยอดต่องวด</div>
                    <div className="text-2xl font-bold text-blue-700">฿{(task.amount||0).toLocaleString()}</div>
                  </div>
                  <div className="text-right">
                    <div className="text-xs text-gray-500">ยอดคงเหลือ: <strong className="text-amber-600">฿{(task.remainingBalance||0).toLocaleString()}</strong></div>
                    <div className="text-[10px] text-gray-400 mt-1">{task.product}</div>
                  </div>
                </div>

                <div className="mb-4">
                  <label className="text-sm font-bold text-gray-700 block mb-2">ยอดจัดเก็บจริง (บาท)</label>
                  <input type="number" value={amount} onChange={e=>setAmount(e.target.value)} className="w-full border-2 border-gray-200 rounded-2xl p-4 text-2xl font-bold text-gray-900 focus:border-blue-500 outline-none transition-colors text-center"/>
                  {quickAmounts.length > 0 && (
                    <div className="flex gap-2 mt-2">
                      {quickAmounts.map(q=>(
                        <button key={q} onClick={()=>setAmount(q)} className={`flex-1 py-2 rounded-xl text-sm font-bold border transition-colors ${Number(amount)===q?'bg-blue-600 text-white border-blue-600':'bg-gray-50 text-gray-600 border-gray-200 hover:border-blue-300'}`}>
                          ฿{q.toLocaleString()}
                        </button>
                      ))}
                    </div>
                  )}
                </div>

                <div className="mb-4">
                  <label className="text-sm font-bold text-gray-700 block mb-2">แนบรูปหลักฐาน</label>
                  <input type="file" accept="image/*" capture="environment" ref={fileRef} className="hidden" onChange={handlePhotoUpload}/>
                  {photo ? (
                    <div className="relative rounded-2xl overflow-hidden">
                      <img src={photo} alt="Preview" className="w-full h-36 object-cover"/>
                      <button onClick={()=>setPhoto(null)} className="absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center shadow-md"><X size={14}/></button>
                    </div>
                  ) : (
                    <button onClick={()=>fileRef.current.click()} className="w-full border-2 border-dashed border-gray-200 rounded-2xl p-5 flex flex-col items-center gap-2 text-gray-400 hover:border-blue-300 hover:bg-blue-50 transition-colors active:scale-98">
                      <Camera size={28}/>
                      <span className="text-sm font-medium">ถ่ายรูป / อัปโหลด</span>
                    </button>
                  )}
                </div>

                <div className="mb-6">
                  <label className="text-sm font-bold text-gray-700 block mb-2">หมายเหตุ (ถ้ามี)</label>
                  <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="เช่น ลูกค้าขอเลื่อน, จ่ายบางส่วน..." className="w-full border-2 border-gray-200 rounded-2xl p-3 text-sm focus:border-blue-500 outline-none resize-none" rows="2"/>
                </div>

                <button onClick={()=>onSave({id:task.id,inputAmount:amount,inputNote:note,inputPhoto:photo})} className="w-full bg-gradient-to-r from-green-500 to-green-600 text-white py-4 rounded-2xl font-bold text-base shadow-lg flex items-center justify-center gap-2 active:scale-98 transition-all">
                  <CheckCircle size={22}/> ยืนยันการบันทึก ฿{Number(amount).toLocaleString()}
                </button>
              </div>
            </div>
          );
        }

        // ─── RECEIPT PREVIEW (SHARED) ─────────────────────────────────────────────────
        function ReceiptPreview({ record, task, settings, onClose, printerDevice, setAlertMsg }) {
          const receiptRef = useRef(null);
          
          const handlePrint = () => {
            // 1. ถ้าเชื่อมต่อ Web Bluetooth ไว้
            if (printerDevice) {
               if(setAlertMsg) setAlertMsg(`กำลังส่งข้อมูลใบเสร็จไปยังเครื่องพิมพ์บลูทูธ: ${printerDevice.name}\n(สถานะ: พิมพ์สำเร็จ!)`);
               return;
            }
            
            // 2. ถ้าพิมพ์ผ่านระบบของมือถือ (System Print)
            const content = receiptRef.current.innerHTML;
            const printDiv = document.createElement('div');
            printDiv.id = 'mobile-print-section';
            printDiv.innerHTML = `
              <style>
                @media print {
                  /* ซ่อนแอปพลิเคชันหลักทั้งหมด */
                  body > *:not(#mobile-print-section) { display: none !important; }
                  
                  /* จัดการหน้าตาของใบเสร็จให้อยู่เต็มจอสำหรับการพิมพ์ */
                  #mobile-print-section { 
                    display: block !important; 
                    position: absolute; left: 0; top: 0; 
                    width: 100%; max-width: 58mm; 
                    background: white; margin: 0; padding: 10px; box-sizing: border-box;
                    font-family: 'Courier New', Courier, monospace; color: black;
                  }
                  @page { margin: 0; size: 58mm auto; }
                  
                  .text-center { text-align: center; }
                  .font-bold { font-weight: bold; }
                  .text-sm { font-size: 14px; }
                  .text-xs { font-size: 12px; }
                  .mb-2 { margin-bottom: 8px; }
                  .mb-4 { margin-bottom: 16px; }
                  .mt-4 { margin-top: 16px; }
                  .border-b { border-bottom: 1px dashed black; padding-bottom: 8px; margin-bottom: 8px; }
                  .flex { display: flex; justify-content: space-between; }
                  img { max-width: 100%; height: auto; display: block; margin: 0 auto; filter: grayscale(100%); }
                  
                  * { color: black !important; }
                }
                @media screen {
                  #mobile-print-section { display: none; }
                }
              </style>
              <div>${content}</div>
            `;
            document.body.appendChild(printDiv);
            
            // สั่งพิมพ์ทันที!
            window.print();
            
            // ลบชุดคำสั่งพิมพ์ทิ้งหลังจากส่งคำสั่ง
            setTimeout(() => {
              const el = document.getElementById('mobile-print-section');
              if (el) el.remove();
            }, 3000);
          };

          return (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[150] p-4 backdrop-blur-sm">
              <div className="bg-gray-100 rounded-2xl w-full max-w-sm overflow-hidden flex flex-col max-h-[90vh]">
                <div className="p-4 bg-white border-b flex justify-between items-center shrink-0">
                  <h3 className="font-bold text-gray-800 flex items-center gap-2"><Receipt size={18} className="text-blue-500"/> ใบเสร็จรับเงิน</h3>
                  <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><X size={20}/></button>
                </div>
                
                <div className="p-6 overflow-y-auto flex-1 bg-gray-200">
                  {/* Mock Thermal Receipt */}
                  <div className="receipt-ticket" ref={receiptRef}>
                    <div className="text-center mb-4 border-b pb-4">
                      {settings.logoUrl && <img src={settings.logoUrl} alt="Logo" className="mx-auto mb-2 max-h-16 object-contain grayscale"/>}
                      <div className="font-bold text-lg leading-tight">{settings.storeName || 'PBD Store'}</div>
                      <div className="text-xs text-gray-600 mt-1 whitespace-pre-wrap">{settings.storeAddress}</div>
                    </div>
                    
                    <div className="text-xs space-y-1.5 mb-4 border-b pb-4">
                      <div className="flex justify-between"><span>วันที่:</span> <span>{new Date(record.date).toLocaleDateString('th-TH')} {new Date(record.date).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}</span></div>
                      <div className="flex justify-between"><span>เลขที่:</span> <span>{record.receiptNo}</span></div>
                      <div className="flex justify-between"><span>พนักงาน:</span> <span>{record.workerId}</span></div>
                    </div>
                    
                    <div className="text-xs space-y-2 mb-4 border-b pb-4">
                      <div className="font-bold">ลูกค้า: {task.name || record.customerName}</div>
                      <div className="text-gray-600">สินค้า: {task.product}</div>
                      <div className="flex justify-between mt-2">
                        <span>ชำระงวดที่ {record.term || '-'}</span>
                        <span className="font-bold text-base">฿{Number(record.amount).toLocaleString()}</span>
                      </div>
                    </div>
                    
                    <div className="text-xs space-y-1.5 mb-6">
                      <div className="flex justify-between text-gray-600"><span>ยอดคงเหลือหลังชำระ:</span> <span className="font-bold">฿{Number(task.remainingBalance || record.remainingBalance || 0).toLocaleString()}</span></div>
                    </div>
                    
                    <div className="text-center text-xs mt-4">
                      <div className="font-bold italic">{settings.footerText || 'ขอบคุณที่ใช้บริการ'}</div>
                      {settings.footerImageUrl && <img src={settings.footerImageUrl} alt="Footer" className="mx-auto mt-3 max-h-20 object-contain grayscale"/>}
                    </div>
                  </div>
                </div>
                
                <div className="p-4 bg-white border-t shrink-0 flex gap-3">
                  <button onClick={onClose} className="flex-1 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200">ปิด</button>
                  <button onClick={handlePrint} className={`flex-1 py-3 text-white font-bold rounded-xl flex items-center justify-center gap-2 shadow-md transition-all active:scale-95 ${printerDevice ? 'bg-blue-600 hover:bg-blue-700' : 'bg-green-600 hover:bg-green-700'}`}>
                    <Printer size={18}/> {printerDevice ? 'พิมพ์ผ่านบลูทูธ' : 'พิมพ์ใบเสร็จ'}
                  </button>
                </div>
              </div>
            </div>
          );
        }

        // ─── SHARED ALERT MODAL ───────────────────────────────────────────────────────
        function AlertModal({ msg, onClose }) {
          return (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[100] p-4 backdrop-blur-sm">
              <div className="bg-white rounded-2xl w-full max-w-sm p-6 text-center shadow-xl">
                <div className="w-14 h-14 bg-red-100 text-red-500 rounded-2xl flex items-center justify-center mx-auto mb-4"><AlertCircle size={28}/></div>
                <p className="text-gray-800 mb-6 font-medium">{msg}</p>
                <button onClick={onClose} className="bg-blue-600 text-white px-6 py-3 w-full rounded-2xl font-bold">ตกลง</button>
              </div>
            </div>
          );
        }

        // ─── INITIALIZE REACT ─────────────────────────────────────────────────────────
        const rootElement = document.getElementById('root');
        const root = createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
