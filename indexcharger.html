<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator & Scanner</title>
    
    <!-- โหลดฟอนต์ Inter จาก Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- โหลดไลบรารีสร้างและสแกน QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2563eb', // Blue-600
                        primaryHover: '#1d4ed8', // Blue-700
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #f3f4f6; /* สีพื้นหลังแอป */
        }

        /* ซ่อน Scrollbar แต่อยู่ให้เลื่อนได้สำหรับช่องแสดง ID */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* เอฟเฟกต์การกดปุ่ม */
        .btn-press:active {
            transform: scale(0.95);
        }

        /* การแต่ง QR Code ให้อยู่ตรงกลางและดูสวยงาม */
        #qrcode-container img {
            margin: 0 auto;
            border-radius: 0.5rem;
        }

        /* ปรับแต่งหน้าตาตัวสแกน QR ของ html5-qrcode */
        #reader {
            border: none !important;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        #reader__dashboard_section_csr select {
            padding: 8px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            background: white;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            outline: none;
        }
        #reader__dashboard_section_csr button {
            background-color: #2563eb !important;
            color: white !important;
            border: none !important;
            padding: 8px 16px !important;
            border-radius: 0.5rem !important;
            font-family: 'Inter', sans-serif !important;
            font-weight: 500 !important;
            font-size: 0.875rem !important;
            margin-top: 0.5rem !important;
            cursor: pointer;
            transition: all 0.2s;
        }
        #reader__dashboard_section_csr button:active {
            transform: scale(0.95);
            background-color: #1d4ed8 !important;
        }
    </style>
</head>
<body class="min-h-screen flex justify-center items-center py-8 px-4 font-sans text-gray-800">

    <!-- Card หลักของแอป -->
    <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col items-center p-6 border border-gray-100">
        
        <!-- ส่วนหัวข้อความและลิงก์ PDF -->
        <div class="w-full flex flex-col items-center mb-6">
            <h1 id="header-text" class="text-2xl font-bold text-gray-900 tracking-tight w-full overflow-x-auto whitespace-nowrap no-scrollbar text-center">GWC-OR-2041,3</h1>
            <a href="#" class="text-primary hover:text-primaryHover text-sm font-medium mt-1 flex items-center gap-1 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                PDF version for printing
            </a>
        </div>

        <!-- พื้นที่สำหรับแสดง QR Code (ใส่กรอบเงาให้ดูเด่นขึ้น) -->
        <div class="p-3 bg-white rounded-2xl shadow-md border border-gray-100 mb-6">
            <div id="qrcode-container"></div>
        </div>

        <!-- ส่วนเลือก Socket (ดีไซน์แบบ Segmented Control) -->
        <div class="w-full mb-6">
            <label class="block text-sm font-semibold text-gray-500 mb-2 uppercase tracking-wider">Socket No.</label>
            <div class="flex p-1 bg-gray-100 rounded-xl">
                <label class="flex-1 text-center cursor-pointer">
                    <input type="radio" name="socket" value="1" class="peer sr-only">
                    <div class="py-2.5 rounded-lg text-gray-500 font-medium peer-checked:bg-white peer-checked:shadow-sm peer-checked:text-primary transition-all duration-200">No. 1</div>
                </label>
                <label class="flex-1 text-center cursor-pointer">
                    <input type="radio" name="socket" value="2" class="peer sr-only">
                    <div class="py-2.5 rounded-lg text-gray-500 font-medium peer-checked:bg-white peer-checked:shadow-sm peer-checked:text-primary transition-all duration-200">No. 2</div>
                </label>
                <label class="flex-1 text-center cursor-pointer">
                    <input type="radio" name="socket" value="3" checked class="peer sr-only">
                    <div class="py-2.5 rounded-lg text-gray-500 font-medium peer-checked:bg-white peer-checked:shadow-sm peer-checked:text-primary transition-all duration-200">No. 3</div>
                </label>
            </div>
        </div>

        <!-- ส่วนแสดงรหัส (หน้าจอดิจิตอล) -->
        <div class="w-full mb-4">
            <label class="block text-sm font-semibold text-gray-500 mb-2 uppercase tracking-wider">Charger ID</label>
            <div id="id-display" class="bg-gray-50 border border-gray-200 rounded-2xl text-5xl font-mono font-semibold text-gray-800 py-4 h-20 flex items-center px-4 overflow-x-auto whitespace-nowrap no-scrollbar shadow-inner justify-end">
                2041
            </div>
        </div>

        <!-- แป้นพิมพ์ 4x3 แบบ Modern -->
        <div class="grid grid-cols-3 gap-3 w-full mb-6">
            <button onclick="pressKey('1')" class="btn-press bg-white border border-gray-200 rounded-2xl py-4 text-2xl font-medium shadow-sm hover:bg-gray-50 transition-all text-gray-800">1</button>
            <button onclick="pressKey('2')" class="btn-press bg-white border border-gray-200 rounded-2xl py-4 text-2xl font-medium shadow-sm hover:bg-gray-50 transition-all text-gray-800">2</button>
            <button onclick="pressKey('3')" class="btn-press bg-white border border-gray-200 rounded-2xl py-4 text-2xl font-medium shadow-sm hover:bg-gray-50 transition-all text-gray-800">3</button>
            
            <button onclick="pressKey('4')" class="btn-press bg-white border border-gray-200 rounded-2xl py-4 text-2xl font-medium shadow-sm hover:bg-gray-50 transition-all text-gray-800">4</button>
            <button onclick="pressKey('5')" class="btn-press bg-white border border-gray-200 rounded-2xl py-4 text-2xl font-medium shadow-sm hover:bg-gray-50 transition-all text-gray-800">5</button>
            <button onclick="pressKey('6')" class="btn-press bg-white border border-gray-200 rounded-2xl py-4 text-2xl font-medium shadow-sm hover:bg-gray-50 transition-all text-gray-800">6</button>
            
            <button onclick="pressKey('7')" class="btn-press bg-white border border-gray-200 rounded-2xl py-4 text-2xl font-medium shadow-sm hover:bg-gray-50 transition-all text-gray-800">7</button>
            <button onclick="pressKey('8')" class="btn-press bg-white border border-gray-200 rounded-2xl py-4 text-2xl font-medium shadow-sm hover:bg-gray-50 transition-all text-gray-800">8</button>
            <button onclick="pressKey('9')" class="btn-press bg-white border border-gray-200 rounded-2xl py-4 text-2xl font-medium shadow-sm hover:bg-gray-50 transition-all text-gray-800">9</button>
            
            <button onclick="pressKey('CLEAR')" class="btn-press bg-red-50 text-red-500 border border-red-100 rounded-2xl py-4 text-lg font-bold shadow-sm hover:bg-red-100 transition-all">C</button>
            <button onclick="pressKey('0')" class="btn-press bg-white border border-gray-200 rounded-2xl py-4 text-2xl font-medium shadow-sm hover:bg-gray-50 transition-all text-gray-800">0</button>
            <button onclick="pressKey('DEL')" class="btn-press bg-gray-100 text-gray-600 border border-gray-200 rounded-2xl py-4 text-lg font-bold shadow-sm hover:bg-gray-200 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z" />
                </svg>
            </button>
        </div>

        <!-- ปุ่มสแกน -->
        <button onclick="openScanner()" class="btn-press w-full bg-primary hover:bg-primaryHover text-white font-bold text-lg py-4 rounded-2xl shadow-lg shadow-blue-500/30 transition-all flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
            </svg>
            SCAN QR CODE
        </button>

    </div>

    <!-- หน้าต่าง (Modal) สำหรับการสแกนกล้อง -->
    <div id="scanner-modal" class="fixed inset-0 bg-gray-900/80 backdrop-blur-sm z-50 flex-col items-center justify-center hidden p-4">
        
        <div class="w-full max-w-md bg-white rounded-3xl overflow-hidden shadow-2xl flex flex-col relative">
            
            <!-- ส่วนหัว Modal -->
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-white z-10">
                <h3 class="font-bold text-lg text-gray-800">Scan Charger QR</h3>
                <button onclick="closeScanner()" class="p-2 bg-gray-100 hover:bg-gray-200 rounded-full text-gray-500 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <!-- พื้นที่กล้อง -->
            <div class="p-4 bg-gray-50 w-full flex justify-center items-center">
                <div id="reader" class="w-full max-w-sm"></div>
            </div>
            
            <!-- กรอบแจ้งเตือนด้านล่างกล้อง -->
            <div class="p-4 text-center text-sm text-gray-500 bg-white">
                <p>Point your camera at the QR Code</p>
                <p class="text-xs mt-1">Format: GWC-OR-[ID],[Socket]</p>
            </div>
        </div>
        
    </div>

    <script>
        // ==========================
        // ส่วนจัดการระบบสร้าง QR Code
        // ==========================
        let chargerId = "2041";
        let socketNo = "3";
        let qrCodeInstance = null;

        const idDisplayEl = document.getElementById("id-display");
        const headerTextEl = document.getElementById("header-text");
        const qrcodeContainer = document.getElementById("qrcode-container");
        const radioButtons = document.querySelectorAll('input[name="socket"]');

        function init() {
            qrCodeInstance = new QRCode(qrcodeContainer, {
                text: getPayloadString(),
                width: 200,
                height: 200,
                colorDark : "#111827", // สีเทาเข้มเกือบดำให้ดูโมเดิร์น
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });

            radioButtons.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    socketNo = e.target.value;
                    updateUI();
                });
            });
            
            updateUI();
        }

        function getPayloadString() {
            return `GWC-OR-${chargerId || "00"},${socketNo}`;
        }

        function pressKey(key) {
            if (key === 'CLEAR') {
                chargerId = "";
            } else if (key === 'DEL') {
                chargerId = chargerId.slice(0, -1);
            } else {
                chargerId += key;
            }
            updateUI();
        }

        function updateUI() {
            // แสดงขีดกรณีไม่ได้พิมพ์อะไรเลยให้ดูสวยงาม
            idDisplayEl.textContent = chargerId || "_";
            idDisplayEl.scrollLeft = idDisplayEl.scrollWidth;
            
            const currentPayload = getPayloadString();
            headerTextEl.textContent = currentPayload;

            if (qrCodeInstance) {
                qrCodeInstance.clear(); 
                qrCodeInstance.makeCode(currentPayload); 
            }
        }

        window.onload = init;


        // ==========================
        // ส่วนจัดการระบบสแกน QR Code (กล้อง)
        // ==========================
        let html5QrcodeScanner = null;
        let isScanningActive = false;

        function openScanner() {
            const modal = document.getElementById('scanner-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            isScanningActive = true;

            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5QrcodeScanner(
                    "reader",
                    { 
                        fps: 10, 
                        qrbox: {width: 250, height: 250},
                        supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
                    },
                    false // verbose
                );
                
                html5QrcodeScanner.render(onScanSuccess, onScanFailure);
            }
        }

        function closeScanner() {
            isScanningActive = false;
            
            const modal = document.getElementById('scanner-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().then(() => {
                    html5QrcodeScanner = null; 
                }).catch(error => {
                    console.error("Failed to clear scanner", error);
                });
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (!isScanningActive) return; 

            const prefix = "GWC-OR-";
            
            if (decodedText.startsWith(prefix)) {
                const dataPart = decodedText.substring(prefix.length); 
                const parts = dataPart.split(",");
                
                if (parts.length === 2) {
                    isScanningActive = false; 
                    
                    chargerId = parts[0];
                    socketNo = parts[1];
                    
                    radioButtons.forEach(radio => {
                        if (radio.value === socketNo) {
                            radio.checked = true;
                        }
                    });
                    
                    updateUI();
                    closeScanner();
                    
                    // เพิ่มลูกเล่นให้ช่อง ID กระพริบสีเขียวเวลารับค่าสำเร็จ (Visual Feedback)
                    idDisplayEl.classList.add('bg-green-100', 'text-green-700');
                    setTimeout(() => {
                        idDisplayEl.classList.remove('bg-green-100', 'text-green-700');
                    }, 500);
                    
                    return;
                }
            }
        }

        function onScanFailure(error) {
            // ไม่ต้องทำอะไร
        }

    </script>
</body>
</html>
